<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Cases</title><style>body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.w{max-width:1200px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#0b2b78,#293f9c);color:white;padding:28px;border-radius:20px}.hero h1{margin:0 0 8px}.bar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.bar{justify-content:space-between;margin:16px 0}.btn,.tab{border:1px solid #dce3ec;background:white;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.tab.on,.primary{background:#0b2b78;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:white;border:1px solid #dce3ec;border-radius:18px;padding:20px}.story{background:#fff9ee;border:1px solid #f0d9a7;padding:16px;border-radius:12px;white-space:pre-line}.res,.score{background:#f5fbff;border:1px solid #cfe1f7;padding:13px;border-radius:12px;margin-top:12px}.key{margin:12px 0}textarea,input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd5e2;border-radius:9px}textarea{min-height:72px}.obs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.g{border:1px solid #dce3ec;border-radius:12px;overflow:hidden}.gh{background:#0b2b78;color:white;padding:8px;text-align:center;font-weight:700}.row{padding:8px;border-bottom:1px solid #eef1f5}.risk{color:#c81e1e}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gate{position:fixed;inset:0;background:#0b2b78ee;display:none;align-items:center;justify-content:center;z-index:99}.gc{background:white;padding:24px;border-radius:16px;width:min(390px,90vw)}@media(max-width:900px){.cards,.two{grid-template-columns:1fr}.obs{grid-template-columns:1fr 1fr}}@media(max-width:600px){.obs{grid-template-columns:1fr}}</style></head><body><div id="gate" class="gate"><div class="gc"><h2 id="gt"></h2><p id="gp">Enter password</p><input id="pw" type="password"><button class="btn primary" style="margin-top:10px" onclick="unlock()">Open</button><div id="err" style="color:#b42318;margin-top:8px"></div></div></div><div class="w"><div class="hero"><h1 id="siteTitle">Final Negotiation Cases</h1><p id="siteSub">One website for Group A, Group B, and the Trainer Guide.</p></div><div class="bar"><div><button class="btn" onclick="home()" id="homeBtn">Home</button><button class="btn" onclick="lang()">العربية / English</button></div></div><main id="app"></main></div><script>const C={A:[['Shared Workspace','مساحة العمل المشتركة','You are Lina, Quality & Reporting Team Lead.','أنتِ لينا، قائدة فريق الجودة والتقارير.','Your team needs about 3 quiet hours most mornings. You prefer the quiet room from 9:00–12:00 but can be flexible on two mornings each week. Another team also needs the shared rooms. HR wants one joint plan within five working days or HR will decide.','فريقك يحتاج تقريباً 3 ساعات هادئة في معظم فترات الصباح. تفضّلين الغرفة الهادئة من 9:00 إلى 12:00، لكن يمكنك المرونة في صباحين كل أسبوع. فريق آخر يحتاج المساحات نفسها. الموارد البشرية تريد خطة مشتركة خلال خمسة أيام، وإلا ستقرر بنفسها.','Use time blocks, quiet hours, booking rules, limited hybrid work, or a trial plan.','يمكن استخدام تقسيم الوقت، ساعات هدوء، قواعد حجز، عمل هجين محدود، أو خطة تجريبية.'],['Peak-Season Annual Leave','الإجازة في موسم الذروة','You are Omar, Team Leader.','أنت عمر، قائد الفريق.','August workload is about 45% higher than normal. At least 7 of 10 employees must be available. Hiba wants the first two weeks of August, but two other employees already have approved leave during part of that period. You can approve one week safely; two consecutive weeks create a coverage gap.','ضغط العمل في أغسطس أعلى بحوالي 45%. يجب توفر 7 من أصل 10 موظفين. هبة تريد أول أسبوعين من أغسطس، لكن موظفين آخرين لديهما إجازة معتمدة خلال جزء من الفترة. يمكنك اعتماد أسبوع واحد بأمان، أما أسبوعان متتاليان فيسببان فجوة في التغطية.','Split leave, shift swaps, remote days, future priority, or rotation.','يمكن تقسيم الإجازة، تبديل المناوبات، أيام عمل عن بُعد، أولوية مستقبلية، أو نظام تناوب.'],['WFH Rotation','تنظيم العمل من المنزل','You are Rana, Supervisor.','أنتِ رنا، مشرفة الفريق.','Employees may work from home up to two days weekly. You need at least 5 people in the office every day and at least 2 experienced employees on-site. Tuesday and Thursday are busiest. Several employees want the same WFH days.','يمكن لكل موظف العمل من المنزل حتى يومين أسبوعياً. تحتاجين إلى 5 أشخاص على الأقل في المكتب يومياً وموظفين خبيرين على الأقل. الثلاثاء والخميس هما الأكثر ضغطاً، وعدة موظفين يريدون الأيام نفسها.','Use fixed days, one fixed + one rotating day, anchor office days, swaps, or monthly rotation.','يمكن استخدام أيام ثابتة، يوم ثابت + يوم متناوب، أيام حضور إلزامية، تبديل الأيام، أو تناوب شهري.'],['Batch Release Under Pressure','اعتماد التشغيلة تحت الضغط','You are the Manufacturing Manager.','أنت مدير التصنيع.','A high-demand batch is due for dispatch tomorrow, but QA found an incomplete line-clearance record and may hold it. The line is booked for the next six days, and a hold would disrupt two other products. The supervisor and two operators remember the clearance being done, but the document is incomplete.','تشغيلة لمنتج عالي الطلب يفترض شحنها غداً، لكن الجودة وجدت سجل Line Clearance غير مكتمل وقد توقف التشغيلة. الخط محجوز للأيام الستة القادمة، والتوقف سيؤثر على منتجين آخرين. المشرف ومشغلان يتذكرون تنفيذ الإجراء، لكن المستند غير مكتمل.','Same-day investigation, record reconciliation, extra QA verification, short hold, deviation/CAPA, or controlled rescheduling.','تحقيق في نفس اليوم، مطابقة السجلات، تحقق إضافي من الجودة، Hold قصير، Deviation/CAPA، أو إعادة جدولة مضبوطة.'],['Job Offer Beyond Salary','عرض وظيفي يتجاوز الراتب','You are the HR Business Partner.','أنت شريك أعمال الموارد البشرية.','The approved salary is 1,150 JOD while the candidate wants 1,300 JOD. You cannot reach 1,300 without an internal-equity problem. You can use transport support, meals, joining bonus, learning budget, certification support, flexible start time, and a six-month salary review linked to performance.','الراتب المعتمد هو 1,150 دينار، بينما المرشح يريد 1,300. لا يمكنك الوصول إلى 1,300 دون مشكلة في العدالة الداخلية. لكن لديك بدائل مثل بدل مواصلات، وجبات، Joining Bonus، ميزانية تعلم، دعم شهادة، وقت بدء مرن، ومراجعة راتب بعد ستة أشهر مرتبطة بالأداء.','Build a total package, not salary only.','ابنِ حزمة عرض كاملة، وليس راتباً فقط.'],['Collection at the Pharmacy','تحصيل المبلغ من الصيدلية','You are the company representative responsible for collection.','أنت مندوب الشركة المسؤول عن التحصيل.','The pharmacy owes 5,400 JOD; 3,000 JOD is over 60 days overdue. Finance wants at least 2,500 JOD this week or the account may go on credit hold. You cannot waive debt, but you may discuss a documented staged plan, post-dated cheques, or a meaningful immediate payment.','على الصيدلية 5,400 دينار، منها 3,000 متأخرة لأكثر من 60 يوماً. المالية تريد 2,500 دينار على الأقل هذا الأسبوع وإلا قد يتم إيقاف الائتمان. لا يمكنك إسقاط الدين، لكن يمكنك مناقشة خطة دفع موثقة أو شيكات مؤجلة أو دفعة فورية ذات معنى.','Immediate payment, instalments, post-dated cheques, smaller orders, or Finance-approved plan.','دفعة فورية، أقساط، شيكات مؤجلة، طلبيات أصغر، أو خطة معتمدة من المالية.']],B:[['Shared Workspace','مساحة العمل المشتركة','You are Samir, Internal Service Desk Team Lead.','أنت سمير، قائد فريق مكتب الخدمة الداخلية.','Your team handles calls, walk-ins, and urgent support. You often need short huddles, especially 10:00–14:00. You can move most huddles to the open area if you receive one guaranteed 60-minute meeting-room slot daily. HR wants one joint plan within five working days.','فريقك يتعامل مع المكالمات والطلبات المباشرة والدعم العاجل. تحتاجون لاجتماعات قصيرة خاصة بين 10:00 و14:00. يمكنك نقل أغلب الاجتماعات للمساحة المفتوحة إذا حصلت على ساعة مضمونة يومياً في غرفة الاجتماعات. الموارد البشرية تريد خطة مشتركة خلال خمسة أيام.','Daily guaranteed slot, headsets, low-noise zone, quiet hours, or trial plan.','ساعة يومية مضمونة، سماعات، منطقة منخفضة الضوضاء، ساعات هدوء، أو خطة تجريبية.'],['Peak-Season Annual Leave','الإجازة في موسم الذروة','You are Hiba, Employee.','أنتِ هبة، موظفة في الفريق.','You want the first two weeks of August. Your request was rejected last year. The first week matters most because of a family event. You could move the second week to early September if week one is approved and you receive fair priority next year. You can also complete handover early and cover one July weekend shift.','تريدين أول أسبوعين من أغسطس. تم رفض طلبك العام الماضي. الأسبوع الأول هو الأهم بسبب مناسبة عائلية. يمكنك نقل الأسبوع الثاني إلى بداية سبتمبر إذا تم اعتماد الأسبوع الأول وحصلت على أولوية عادلة العام القادم. ويمكنك إنهاء التسليم مسبقاً وتغطية مناوبة نهاية أسبوع في يوليو.','Trade timing, handover, weekend coverage, remote days, or future priority.','يمكن التفاوض على التوقيت، التسليم، تغطية نهاية الأسبوع، العمل عن بُعد، أو أولوية مستقبلية.'],['WFH Rotation','تنظيم العمل من المنزل','You are Ahmad, Senior Employee and informal team representative.','أنت أحمد، موظف خبير وممثل غير رسمي لزملائك.','You commute about 90 minutes each way and prefer Monday and Thursday as WFH days. Other colleagues also have strong preferences. You would accept one fixed day plus one rotating day if the system is transparent and fair.','تستغرق مواصلاتك حوالي 90 دقيقة في كل اتجاه وتفضّل الاثنين والخميس للعمل من المنزل. زملاء آخرون لديهم تفضيلات قوية أيضاً. يمكنك قبول يوم ثابت ويوم متناوب إذا كان النظام واضحاً وعادلاً.','One fixed + one rotating day, monthly rotation, anchor office days, or swaps.','يوم ثابت + يوم متناوب، تناوب شهري، أيام حضور إلزامية، أو تبديل الأيام.'],['Batch Release Under Pressure','اعتماد التشغيلة تحت الضغط','You are the QA Manager.','أنت مدير الجودة.','A line-clearance record is incomplete. A recent internal audit criticized documentation discipline, so another weak decision could create a major CAPA escalation. The product is needed, but verbal reassurance is not enough. You are open to a fast investigation and extra verification if procedures support it.','سجل Line Clearance غير مكتمل. تدقيق داخلي حديث انتقد ضعف التوثيق، وأي قرار ضعيف آخر قد يؤدي إلى تصعيد CAPA كبير. المنتج مطلوب، لكن التطمينات الشفهية غير كافية. أنت منفتح على تحقيق سريع وتحقيق إضافي إذا سمحت الإجراءات.','Same-day deviation review, record reconciliation, extra sampling, documented evidence, or short hold.','مراجعة Deviation بنفس اليوم، مطابقة السجلات، عينات إضافية، أدلة موثقة، أو Hold قصير.'],['Job Offer Beyond Salary','عرض وظيفي يتجاوز الراتب','You are the candidate.','أنت المرشح للوظيفة.','The company offered 1,150 JOD; you asked for 1,300 JOD. Another possible role may reach about 1,250 JOD, but it is farther and less attractive. Your commute here may cost 65–80 JOD monthly, and a certification you want costs about 800 JOD. You may accept less than 1,300 if the total package clearly closes the gap and commitments are written.','الشركة عرضت 1,150 دينار وأنت طلبت 1,300. هناك فرصة أخرى قد تصل إلى 1,250 لكنها أبعد وأقل جاذبية. المواصلات هنا قد تكلفك 65–80 دينار شهرياً، والشهادة التي تريدها تكلف نحو 800 دينار. يمكنك قبول أقل من 1,300 إذا كانت الحزمة الكاملة تسد الفجوة وكانت الالتزامات مكتوبة.','Trade salary against transport, bonus, certification, learning, flexibility, and six-month review.','وازن بين الراتب وبدل المواصلات والـBonus والشهادة والتعلم والمرونة ومراجعة بعد ستة أشهر.'],['Collection at the Pharmacy','تحصيل المبلغ من الصيدلية','You are the pharmacist/owner.','أنت الصيدلانية/مالكة الصيدلية.','You owe 5,400 JOD but have only 1,600 JOD available this week. You expect about 2,200 JOD from insurance in 12–15 days, but the exact date is not guaranteed. You do not want credit hold because several fast-moving products are important to your customers.','عليكِ 5,400 دينار لكن المتاح هذا الأسبوع فقط 1,600. تتوقعين حوالي 2,200 دينار من التأمين خلال 12–15 يوماً، لكن الموعد غير مضمون. لا تريدين Credit Hold لأن منتجات سريعة الحركة مهمة لعملائك.','1,600 now, dated cheque, staged repayment, reduced temporary orders, or documented payment schedule.','1,600 الآن، شيك مؤجل، سداد مرحلي، طلبيات أصغر مؤقتاً، أو جدول دفع موثق.']]};const G=[['Shared Workspace','Lina wants ~3 quiet hours, ideally 9–12. Samir needs access 10–14 but can accept one guaranteed hour.',['Protected quiet block + fixed 60-minute Service Desk slot','Two flexible mornings','Headsets / low-noise zone','Hybrid document review','4-week trial']],['Peak-Season Leave','Omar needs 7/10 available; Hiba needs week 1 most and can move week 2.',['Week 1 August + week 1 September','Shift swap','Weekend coverage','Remote days','Future priority']],['WFH Rotation','Rana needs 5 onsite + 2 experienced; Ahmad prefers Mon/Thu but accepts one fixed + one rotating day.',['One fixed + one rotating day','Monthly rotation','Anchor office day','Swap system','Role-based coverage']],['Batch Release','Manufacturing needs supply continuity; QA needs objective, defensible evidence before release.',['Same-day investigation','Reconcile records','Enhanced QA verification','Short hold pending evidence','CAPA/documented evidence','Controlled reschedule if evidence fails']],['Job Offer','Candidate asks 1,300 JOD; HR base cap is 1,150 JOD but other package levers exist.',['1,150 + transport + certification','1,150 + joining bonus + 6-month review','Learning budget + flexibility','12-month package comparison','Conditional step-up after targets']],['Pharmacy Collection','Rep needs 2,500 JOD this week; pharmacy has 1,600 now and expects ~2,200 in 12–15 days.',['1,600 now + post-dated cheque','1,600 now + documented plan','Reduced order volume','Finance-approved exception','Dated instalments']]];const H=[['Proposing',['Propose Idea','Propose Solution','Provisional Solution','Counter Proposal'],[1,1,1,0]],['Receiving',['Agree','Disagree','Check Understanding','Say No'],[1,1,1,0]],['Validating',['Seek Options','Ask Questions','Look for Justification','Interrupt'],[1,1,1,0]],['Expressing',['Express Emotions','Identify Common Ground','Acknowledge Differences','Attack'],[1,1,1,0]],['Closing',['Summarizing','Sportsmanship','Closing','Assumption'],[1,1,1,0]]];let ar=false,mode='',cur=0,pending='';const app=document.getElementById('app');function lang(){ar=!ar;document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';document.getElementById('siteTitle').textContent=ar?'حالات التفاوض النهائية':'Final Negotiation Cases';document.getElementById('siteSub').textContent=ar?'موقع واحد للمجموعة A والمجموعة B ودليل المدرب.':'One website for Group A, Group B, and the Trainer Guide.';document.getElementById('homeBtn').textContent=ar?'الرئيسية':'Home';render()}function home(){mode='';render()}function openMode(m){pending=m;document.getElementById('gate').style.display='flex';document.getElementById('gt').textContent=m==='A'?'Group A':m==='B'?'Group B':ar?'دليل المدرب':'Trainer Guide';document.getElementById('gp').textContent=ar?'أدخل كلمة المرور':'Enter password';document.getElementById('pw').value='';document.getElementById('err').textContent=''}function unlock(){let p=document.getElementById('pw').value;if((pending==='A'&&p==='group a')||(pending==='B'&&p==='group b')||(pending==='T'&&p==='Trainer')){mode=pending;cur=0;document.getElementById('gate').style.display='none';render()}else document.getElementById('err').textContent=ar?'كلمة المرور غير صحيحة':'Incorrect password'}function tabs(){return '<div class="tabs">'+[0,1,2,3,4,5].map(i=>'<button class="tab '+(i===cur?'on':'')+'" onclick="cur='+i+';render()">'+(ar?'الحالة ':'Case ')+(i+1)+'</button>').join('')+'</div>'}function prep(){return '<div class="key"><b>'+(ar?'1. الاهتمامات':'1. Interests')+'</b><textarea class="p"></textarea></div><div class="key"><b>'+(ar?'2. الخيارات — ثلاثة على الأقل':'2. Options — minimum 3')+'</b><input class="p" type="text"><br><br><input class="p" type="text"><br><br><input class="p" type="text"></div><div class="key"><b>'+(ar?'3. البدائل':'3. Alternatives')+'</b><textarea class="p"></textarea></div><div class="key"><b>'+(ar?'4. الشرعية / المعايير العادلة':'4. Legitimacy')+'</b><textarea class="p"></textarea></div><div class="key"><b>'+(ar?'5–6. التواصل والعلاقة':'5–6. Communication & Relationship')+'</b><textarea class="p"></textarea></div><div class="key"><b>'+(ar?'7. الالتزام':'7. Commitment')+'</b><textarea class="p"></textarea></div>'}function obs(id){return '<div class="obs">'+H.map(g=>'<div class="g"><div class="gh">'+g[0]+'</div>'+g[1].map((b,i)=>'<div class="row '+(g[2][i]?'':'risk')+'">'+b+'<br><label><input type="radio" name="'+id+'_'+g[0]+'_'+i+'" value="y" data-p="'+g[2][i]+'"> Yes</label> <label><input type="radio" name="'+id+'_'+g[0]+'_'+i+'" value="n" data-p="'+g[2][i]+'"> No</label></div>').join('')+'</div>').join('')+'</div>'}function score(root){let s=0;root.querySelectorAll('input[type=radio]:checked').forEach(x=>{let pos=x.dataset.p==='1';if((pos&&x.value==='y')||(!pos&&x.value==='n'))s++});return s}function showPrep(){let v=[...document.querySelectorAll('.p')].map(x=>x.value.trim());let labels=ar?['الاهتمامات','خيار 1','خيار 2','خيار 3','البدائل','الشرعية','التواصل والعلاقة','الالتزام']:['Interests','Option 1','Option 2','Option 3','Alternatives','Legitimacy','Communication & Relationship','Commitment'];document.getElementById('prepOut').innerHTML=labels.map((x,i)=>'<b>'+x+':</b> '+(v[i]||'—')).join('<br>')}function render(){if(!mode){app.innerHTML='<div class="cards"><div class="card"><h2>Group A</h2><p>'+(ar?'ست حالات تفاوض مع التحضير والتقييم.':'Six negotiation cases with preparation and observation.')+'</p><button class="btn primary" onclick="openMode(\'A\')">'+(ar?'فتح المجموعة A':'Open Group A')+'</button></div><div class="card"><h2>Group B</h2><p>'+(ar?'الحالات نفسها من منظور الطرف الثاني.':'The same cases from the other side of the negotiation.')+'</p><button class="btn primary" onclick="openMode(\'B\')">'+(ar?'فتح المجموعة B':'Open Group B')+'</button></div><div class="card"><h2>'+(ar?'دليل المدرب':'Trainer Guide')+'</h2><p>'+(ar?'الحلول وتقييم الفريقين جنباً إلى جنب.':'Solutions and side-by-side team evaluation.')+'</p><button class="btn primary" onclick="openMode(\'T\')">'+(ar?'فتح دليل المدرب':'Open Trainer Guide')+'</button></div></div>';return}if(mode==='T')trainer();else group()}function group(){let c=C[mode][cur],k=ar?1:0;app.innerHTML=tabs()+'<div class="panel"><h2>'+(ar?'الحالة ':'Case ')+(cur+1)+' — '+c[k]+'</h2><h3>'+c[k+2]+'</h3><div class="story">'+c[k+4]+'</div><div class="res"><b>'+(ar?'موارد يمكنك استخدامها':'Resources you may use')+':</b> '+c[k+6]+'</div><h3>'+(ar?'التحضير باستخدام مفاتيح التفاوض السبعة':'7-Key Preparation')+'</h3>'+prep()+'<button class="btn primary" onclick="showPrep()">'+(ar?'إرسال التحضير':'Submit Preparation')+'</button><div id="prepOut" class="score"></div><hr><h3>'+(ar?'ورقة الملاحظة':'Observation Sheet')+'</h3>'+obs(mode+cur)+'<button class="btn primary" onclick="document.getElementById(\'sc\').textContent=\''+(ar?'النتيجة: ':'Score: ')+'\'+score(document.querySelector(\'.panel\'))+\'/20\'">'+(ar?'إرسال التقييم':'Submit Observation')+'</button><div id="sc" class="score"></div></div>'}function trainer(){let g=G[cur];app.innerHTML=tabs()+'<div class="panel"><h2>'+(ar?'الحالة ':'Case ')+(cur+1)+' — '+g[0]+'</h2><div class="res"><b>'+(ar?'الخلاف والأرقام':'Conflict / numbers')+':</b> '+g[1]+'<br><b>'+(ar?'خيارات محتملة':'Possible options')+':</b><ul>'+g[2].map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="two"><div><h3>Team 1</h3>'+obs('t1_'+cur)+'</div><div><h3>Team 2</h3>'+obs('t2_'+cur)+'</div></div><button class="btn primary" onclick="tf()">'+(ar?'إرسال تقييم المدرب':'Submit Trainer Evaluation')+'</button><div id="fb" class="score"></div></div>'}function tf(){let sides=document.querySelectorAll('.two>div'),a=score(sides[0]),b=score(sides[1]);let f=n=>n>=16?(ar?'أداء قوي ومتوازن':'Strong and balanced'):n>=12?(ar?'أداء جيد مع فرص للتحسين':'Good with improvement opportunities'):(ar?'يحتاج أسئلة أكثر وخيارات أوضح وإغلاق أقوى':'Needs more questions, options, and clearer closing');document.getElementById('fb').innerHTML='Team 1: '+a+'/20 — '+f(a)+'<br>Team 2: '+b+'/20 — '+f(b)}render();</script></body></html>
