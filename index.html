    function normalizePair(domain){

    function component(label,value){return `<div class="component"><span>${label}</span><strong>${Math.round(value)}%</strong></div>`}
    function careerCard(c,rank,p){
      return `<article class="career-card"><div class="career-top"><div class="rank">${rank}</div><div class="career-title"><h3>${pick(c.title)}</h3><p>${pick(c.cluster)}</p></div><div class="score" style="--score:${Math.round(c.scores.overall)}"><strong>${Math.round(c.scores.overall)}%</strong></div></div><div class="job-overview"><h4>${tx("jobOverview")}</h4><p>${jobDescription(c)}</p></div><div class="component-grid">${component(tx("interest"),c.scores.interest)}${component(tx("personalityScore"),c.scores.personality)}${component(tx("strength"),c.scores.strength)}${component(tx("motivation"),c.scores.motivation)}</div><div class="career-body"><div><h4>${tx("whyMore")}</h4><p class="callout">${whyText(c,p)}</p><ul class="why-list">${whyDetails(c,p).map(x=>`<li>${x}</li>`).join("")}</ul><h4>${tx("activities")}</h4><ul>${c.tasks.map(x=>`<li>${pick(x)}</li>`).join("")}</ul></div><div><h4>${tx("tradeoff")}</h4><p>${pick(c.tradeoff)}</p><h4>${tx("develop")}</h4><p>${pick(c.development)}</p></div></div></article>`;
    }
    function bars(title,entries,labelMap=labels){return `<article class="trait-card"><h3>${title}</h3><div class="bars">${entries.map(([k,v])=>`<div class="bar-row"><span>${pick(labelMap[k])}</span><div class="bar"><span style="width:${v}%"></span></div><strong>${v}</strong></div>`).join("")}</div></article>`}
    function aspectCard(id,title,answer,explanation,entries,labelMap=labels){
      return `<details class="aspect-card" id="aspect-${id}" data-report-section="${id}"><summary><div><span>${title}</span><strong>${answer}</strong><small>${tx("clickExpand")}</small></div></summary><div class="aspect-content"><p class="aspect-explanation">${explanation}</p>${bars(title,entries,labelMap)}<div class="download-row"><button class="secondary" onclick="event.preventDefault();event.stopPropagation();printSection('${id}')">${tx("downloadAspect")}</button></div></div></details>`;
    }
    function openAspect(id){const el=document.getElementById(`aspect-${id}`);if(!el)return;el.open=true;el.scrollIntoView({behavior:"smooth",block:"center"})}
    function printSection(id){
      if(id==="full"){
        const details=[...document.querySelectorAll(".aspect-card")],states=details.map(x=>x.open);details.forEach(x=>x.open=true);setTimeout(()=>{window.print();details.forEach((x,i)=>x.open=states[i])},40);return;
      }
      const source=document.querySelector(`[data-report-section="${id}"]`);if(!source)return;
      const layer=document.createElement("section"),copy=source.cloneNode(true);copy.open=true;layer.className="print-copy";layer.innerHTML=`<h1>Pharmacist PathFinder</h1><p>${tx("profile")}</p>`;layer.appendChild(copy);document.body.appendChild(layer);document.body.classList.add("printing-section");setTimeout(()=>{window.print();document.body.classList.remove("printing-section");layer.remove()},40);
    }
    function questionize(textValue,isArabic=false){
      if(isArabic){
        const s=textValue.replace(/[؟?.!]$/g,"");
        const replacements=[["أفهم ","تفهم "],["أستطيع ","تستطيع "],["لدي ","لديك "],["أثق ","تثق "],["أكتب ","تكتب "],["أعرف ","تعرف "],["أنا ","أنت "],["أستخدم ","تستخدم "],["أشعر ","تشعر "],["أتابع ","تتابع "]];
        const pair=replacements.find(([from])=>s.startsWith(from));return `هل ${pair?pair[1]+s.slice(pair[0].length):s}؟`;
      }
      const s=textValue.replace(/[.?!]$/g,"");
      if(/^I understand /i.test(s))return `Do you understand ${s.slice(13)}?`;
      if(/^I can /i.test(s))return `Can you ${s.slice(6)}?`;
      if(/^I have /i.test(s))return `Do you have ${s.slice(7)}?`;
      if(/^I am /i.test(s))return `Are you ${s.slice(5)}?`;
      if(/^I know /i.test(s))return `Do you know ${s.slice(7)}?`;
      if(/^I use /i.test(s))return `Do you use ${s.slice(6)}?`;
      if(/^I write /i.test(s))return `Can you write ${s.slice(8)}?`;
      if(/^I follow /i.test(s))return `Do you follow ${s.slice(9)}?`;
      return `Is this true for you: ${s}?`;
    }
    function buildReadinessItems(c){
      const role=pick(c.title),cluster=pick(c.cluster),task1=pick(c.tasks[0]),task2=pick(c.tasks[1]),development=pick(c.development);
      const baseItems=c.readiness.map((x,i)=>({q:lang==="en"?questionize(x.en):questionize(x.ar,true),weight:i<2?3:2}));
      const extra=lang==="en"?[
        {q:`Have you completed technical training or a recognized certification relevant to ${role}, particularly in the priority areas: ${development}`,weight:2},
        {q:`Do you meet the current Jordanian employer and regulatory requirements for ${role}, including the pharmacy degree, professional registration, and required experience where applicable?`,weight:3},
        {q:`Can you demonstrate ${task1.charAt(0).toLowerCase()+task1.slice(1)} through a work example, internship, simulation, or project?`,weight:2},
        {q:`Can you demonstrate ${task2.charAt(0).toLowerCase()+task2.slice(1)} through evidence from practice or a portfolio?`,weight:2},
        {q:`Can you use the data, documentation, and digital tools commonly required in ${cluster}?`,weight:2},
        {q:`Can you explain the main quality, ethical, and compliance requirements that affect ${role}?`,weight:2},
        {q:`Do you have a practical development plan to close any remaining gaps for ${role}?`,weight:1}
      ]:[
        {q:`هل أكملت تدريباً تقنياً أو شهادة معترفاً بها مرتبطة بمسار ${role}، وخاصة في مجالات التطوير التالية: ${development}`,weight:2},
        {q:`هل تستوفي متطلبات أصحاب العمل والجهات التنظيمية الحالية في الأردن لمسار ${role}، بما في ذلك الدرجة الصيدلانية والتسجيل المهني والخبرة المطلوبة عند انطباقها؟`,weight:3},
        {q:`هل تستطيع إثبات قدرتك على ${task1} من خلال مثال عملي أو تدريب أو محاكاة أو مشروع؟`,weight:2},
        {q:`هل تستطيع إثبات قدرتك على ${task2} من خلال دليل من الممارسة أو ملف أعمال؟`,weight:2},
        {q:`هل تستطيع استخدام أدوات البيانات والتوثيق والأنظمة الرقمية المطلوبة عادةً في ${cluster}؟`,weight:2},
        {q:`هل تستطيع شرح أهم متطلبات الجودة والأخلاقيات والامتثال التي تؤثر في مسار ${role}؟`,weight:2},
        {q:`هل لديك خطة تطوير عملية لسد الفجوات المتبقية لمسار ${role}؟`,weight:1}
      ];
      return [...baseItems,...extra].slice(0,10);
    }
    const readyValue=(id,i)=>{const v=readyState[id+"_"+i];return v===true?1:(typeof v==="number"?v:0)};
    const weightLabel=w=>w===3?tx("essential"):(w===2?tx("important"):tx("helpful"));
    function readinessHtml(top){
      if(!showReadiness)return `<div class="actions readiness-start"><button class="secondary" onclick="toggleReadiness()">${tx("readiness")}</button></div>`;
      if(!readinessCareerId||!top.some(c=>c.id===readinessCareerId))readinessCareerId=top[0].id;
      const c=top.find(x=>x.id===readinessCareerId),items=buildReadinessItems(c),max=items.reduce((s,x)=>s+x.weight,0),earned=items.reduce((s,x,i)=>s+x.weight*readyValue(c.id,i),0),pct=Math.round((earned/max)*100);
      return `<section class="readiness" data-report-section="readiness"><div class="career-top"><div><h2>${tx("readinessTitle")}</h2><p>${tx("readinessIntro")}</p></div><button class="ghost" onclick="toggleReadiness()">${tx("closeReadiness")}</button></div><h3>${tx("chooseCareer")}</h3><div class="career-tabs">${top.map(x=>`<button class="career-tab ${x.id===c.id?"active":""}" onclick="selectReadinessCareer('${x.id}')">${pick(x.title)}</button>`).join("")}</div><div class="readiness-score"><div><span>${tx("weightedScore")}</span><p class="note">${tx("readinessNote")}</p></div><strong>${pct}%</strong></div><div class="ready-career"><h3>${pick(c.title)} · 10 ${lang==="en"?"questions":"أسئلة"}</h3>${items.map((item,i)=>{const current=readyState[c.id+"_"+i];return `<div class="readiness-question"><div class="question-line"><span class="weight-badge">${weightLabel(item.weight)} · ×${item.weight}</span><strong>${i+1}. ${item.q}</strong></div><div class="ready-options">${[[1,tx("yes")],[.5,tx("partly")],[0,tx("notYet")]].map(([v,label])=>`<button class="ready-option ${current===v||(current===true&&v===1)?"active":""}" onclick="setReady('${c.id}',${i},${v})">${label}</button>`).join("")}</div></div>`}).join("")}</div></section>`;
    }
    function toggleReadiness(){showReadiness=!showReadiness;renderResults();setTimeout(()=>document.querySelector(".readiness")?.scrollIntoView({behavior:"smooth"}),50)}
    function selectReadinessCareer(id){readinessCareerId=id;renderResults();setTimeout(()=>document.querySelector(".readiness")?.scrollIntoView({behavior:"smooth",block:"start"}),40)}
    function setReady(id,i,val){readyState[id+"_"+i]=val;localStorage.setItem("pp_ready",JSON.stringify(readyState));renderResults()}
    function resetAssessment(){if(!confirm(tx("confirmReset")))return;answers=[];readyState={};readinessCareerId=null;localStorage.removeItem("pp_answers");localStorage.removeItem("pp_ready");screen="intro";render();window.scrollTo({top:0,behavior:"smooth"})}
    function renderResults(){
      if(answers.filter(x=>x!=null).length<questions.length){screen="quiz";index=Math.max(0,answers.findIndex(x=>x==null));renderQuiz();return}
      const p=buildProfile(),matched=matchCareers(p),top=matched.slice(0,4),topStrengths=topEntries(p.strength,5),topMot=topEntries(p.motivation,5),holland=p.holland.slice(0,3).join(""),style=pick(styleNames[p.type]||bi("Work-style explorer","مستكشف أسلوب العمل"));
      const interestAnswer=`${p.holland.slice(0,3).map(k=>pick(labels[k])).join(" · ")} (${holland})`,strengthAnswer=topStrengths.slice(0,3).map(([k])=>pick(labels[k])).join(" · "),motivationAnswer=topMot.slice(0,3).map(([k])=>pick(labels[k])).join(" · ");
      const chips=`<button class="profile-chip" onclick="openAspect('interest')"><span>${tx("interest")}</span><strong>${holland}</strong><small>${tx("clickExpand")}</small></button><button class="profile-chip" onclick="openAspect('personality')"><span>${tx("personalityScore")}</span><strong>${p.type}</strong><small>${tx("clickExpand")}</small></button><button class="profile-chip" onclick="openAspect('strength')"><span>${tx("strength")}</span><strong>${pick(labels[topStrengths[0][0]])}</strong><small>${tx("clickExpand")}</small></button><button class="profile-chip" onclick="openAspect('motivation')"><span>${tx("motivation")}</span><strong>${pick(labels[topMot[0][0]])}</strong><small>${tx("clickExpand")}</small></button>`;
      const aspects=`<section class="profile-aspects">${aspectCard("interest",tx("interest"),interestAnswer,tx("interestExplain"),topEntries(p.interest,6))}${aspectCard("personality",tx("personalityScore"),`${p.type} · ${style}`,tx("personalityExplain"),topEntries(p.personality,8),personalityLabels)}${aspectCard("strength",tx("strength"),strengthAnswer,tx("strengthExplain"),topStrengths)}${aspectCard("motivation",tx("motivation"),motivationAnswer,tx("motivationExplain"),topMot)}</section>`;
      app.innerHTML=header()+`<main class="shell results"><section class="results-head"><div class="eyebrow" style="color:#b9eac0">${tx("results")}</div><h1>${top[0]?pick(top[0].title):"Pharmacist PathFinder"}</h1><p>${tx("resultIntro")}</p><div class="profile-strip">${chips}</div><div class="actions" style="margin-top:22px"><button class="primary" onclick="printSection('full')">${tx("downloadFull")}</button><button class="secondary" onclick="resetAssessment()">${tx("retake")}</button></div></section><h2 class="section-title profile-title">${tx("profile")}</h2><p>${tx("profileIntro")}</p>${aspects}<h2 class="section-title">${tx("matches")}</h2><section class="career-list">${top.map((c,i)=>careerCard(c,i+1,p)).join("")}</section>${readinessHtml(top)}<p class="note">${tx("disclaimer")}</p></main>`+footer();
    }
    function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";if(screen==="quiz")renderQuiz();else if(screen==="results")renderResults();else renderIntro()}
    window.toggleLang=toggleLang;window.startAssessment=startAssessment;window.choose=choose;window.goBack=goBack;window.goNext=goNext;window.toggleReadiness=toggleReadiness;window.selectReadinessCareer=selectReadinessCareer;window.setReady=setReady;window.resetAssessment=resetAssessment;window.openAspect=openAspect;window.printSection=printSection;
    render();
  </script>
</body>
</html>
